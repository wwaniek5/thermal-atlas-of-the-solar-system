<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A globe with wavy isotherm bands in the site's colour scale
       (src/map/colors.ts): cold poles, a warm equator, the axis tilted,
       and soft shading so it reads as a sphere. -->
  <defs>
    <clipPath id="disc">
      <circle cx="32" cy="32" r="29.5" />
    </clipPath>
    <radialGradient id="light" cx="0.34" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35" />
      <stop offset="0.45" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.8" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#000" stop-opacity="0.3" />
    </radialGradient>
  </defs>
  <g clip-path="url(#disc)">
    <g transform="rotate(-23 32 32)">
      <rect x="-20" y="-20" width="104" height="104" fill="#0d366b" />
      <path d="M-20 10 C0 4 12 16 32 11 S64 6 84 10 V84 H-20 Z" fill="#2a78d6" />
      <path d="M-20 19 C2 13 14 24 34 19 S66 15 84 19 V84 H-20 Z" fill="#9ec5f4" />
      <path d="M-20 26 C4 21 16 31 36 26 S66 22 84 26 V84 H-20 Z" fill="#f6c1b5" />
      <path d="M-20 31 C2 27 18 36 38 31 S66 28 84 31 V84 H-20 Z" fill="#e34948" />
      <path d="M-20 38 C4 34 18 42 38 37 S66 35 84 38 V84 H-20 Z" fill="#f6c1b5" />
      <path d="M-20 44 C2 41 16 48 36 43 S66 41 84 44 V84 H-20 Z" fill="#9ec5f4" />
      <path d="M-20 51 C0 48 14 55 34 50 S64 49 84 51 V84 H-20 Z" fill="#2a78d6" />
      <path d="M-20 58 C2 56 14 61 32 57 S64 57 84 58 V84 H-20 Z" fill="#0d366b" />
      <g fill="none" stroke="#0b0b0b" stroke-opacity="0.35" stroke-width="1">
        <path d="M-20 19 C2 13 14 24 34 19 S66 15 84 19" />
        <path d="M-20 31 C2 27 18 36 38 31 S66 28 84 31" />
        <path d="M-20 44 C2 41 16 48 36 43 S66 41 84 44" />
      </g>
    </g>
    <circle cx="32" cy="32" r="29.5" fill="url(#light)" />
